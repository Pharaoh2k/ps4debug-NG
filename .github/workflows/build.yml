name: build

on:
  push:
    branches: [integration/all-prs]
  workflow_dispatch:

jobs:
  payload-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build host toolchain (build.sh requires GCC 13.3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          gcc --version

      - name: Build payload (build.sh gates on Ubuntu 24.04 + GCC 13.3.0)
        run: bash ./build.sh   # build.sh is committed without the execute bit

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-payload
          path: |
            debugger/*.bin
            kdebugger/*.bin
            installer/*.bin
